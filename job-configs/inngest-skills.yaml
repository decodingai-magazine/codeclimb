# Inngest, arm `skills`: the inngest plugin's skills. Assemble first: python3 assemble.py inngest
# The budget cap, kwargs.max_budget_usd: 2x the costliest phase-B trial ($15.78), docs/codeclimb-eval-spec.md "Jobs, repeats, cost".
job_name: inngest-skills
n_attempts: 3
n_concurrent_trials: 1
tasks: [{ path: tasks/codeclimb-inngest }]
environment:
  type: docker
retry:
  max_retries: 1
  # Writing this list replaces Harbor's default: the default, plus the two a usage limit or the budget cap can raise
  # (docs/codeclimb-eval-spec.md, "Jobs, repeats, cost").
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
    - ApiUsageLimitError
    - AgentSafetyRefusalError
    - AgentAuthenticationError
    - ModelNotFoundError
    - UnsupportedModelParametersError
    - NonZeroAgentExitCodeError
    - UnknownApiError
agents:
  - name: claude-code
    model_name: anthropic/claude-opus-5-5
    kwargs: { reasoning_effort: medium, max_budget_usd: "32" }
    skills:
      - context/inngest/skills/inngest-agents
      - context/inngest/skills/inngest-api
      - context/inngest/skills/inngest-api-cli
      - context/inngest/skills/inngest-brownfield-audit
      - context/inngest/skills/inngest-cli
      - context/inngest/skills/inngest-cloud
      - context/inngest/skills/inngest-durable-functions
      - context/inngest/skills/inngest-events
      - context/inngest/skills/inngest-flow-control
      - context/inngest/skills/inngest-middleware
      - context/inngest/skills/inngest-realtime
      - context/inngest/skills/inngest-setup
      - context/inngest/skills/inngest-steps
      - context/inngest/skills/inngest-v3-v4-migration
extra_instruction_paths: [context/inngest/skills-pointer.md]
