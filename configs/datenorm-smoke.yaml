# Smoke night: 2 rounds × 1 experiment on the datenorm scenario, Docker sandboxes,
# Inngest dev server. Coders: GitHub Copilot Haiku via Pi; reviewer: a different Haiku.
scenario: scenarios/datenorm
sandbox: docker
max_rounds: 2
deadline: 3h
timeouts:
  experiment_min: 10
  eval_min: 3
models:
  - github-copilot/claude-haiku-5.5
coder_thinking: medium  # off | minimal | low | medium | high
parallel:              # every model through round step_after, then min
  decay: step           # step | linear | none (every model, every round)
  step_after: 3
  min: 1
reviewer_model: github-copilot/claude-haiku-4.5
reviewer_thinking: high
allowed_models: []
primary_metric: accuracy
thresholds:
  accuracy: 1.01  # unreachable on purpose: the smoke night ends on max_rounds
gates:
  schema_violations: 0
  latency_query_p95_ms: 50
min_gain: 0.02
budget_usd:
  experiment: 1.0
  night: 10.0
results_path: runs/datenorm-smoke/results.jsonl
