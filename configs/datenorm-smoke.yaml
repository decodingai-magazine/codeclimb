# Smoke night: 2 rounds × 3 branches on the datenorm scenario, Docker sandboxes,
# Inngest dev server. Coders: GitHub Copilot Haiku via Pi; reviewer: a different Haiku.
spec_dir: scenarios/datenorm/spec
dataset_dir: scenarios/datenorm/dataset
run_cmd: python3 /eval/run.py
run_files: [scenarios/datenorm/metrics/run.py]
score_cmd: python3 scenarios/datenorm/metrics/score.py
hidden_fields: [family]
sandbox: docker
baseline: autocode-base
max_rounds: 2
deadline: 3h
timeouts:
  experiment_min: 10
  eval_min: 3
models:
  - github-copilot/claude-haiku-5.5
  - github-copilot/claude-haiku-5.5
  - github-copilot/claude-haiku-5.5
reviewer_model: github-copilot/claude-haiku-4.5
allowed_models: []
primary_metric: accuracy
thresholds:
  accuracy: 1.0   # unreachable on purpose: the smoke night ends on max_rounds
gates:
  schema_violations: 0
  latency_query_p95_ms: 50
min_gain: 0.02
overfit_gap: 0.05
max_validations: 3
budget_usd:
  experiment: 1.0
  night: 10.0
results_path: runs/datenorm-smoke/results.jsonl
