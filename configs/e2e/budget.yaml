# End-to-end test of the cost cap. Real models only: mock models cost 0, so the cap can't fire.
# The night budget is a few cents, so the night must end on `budget` within 3 rounds.
scenario: scenarios/datenorm
sandbox: docker
max_rounds: 6
plateau_rounds: 0   # never: only the budget may end this night
deadline: 1h
timeouts:
  experiment_min: 5
  eval_min: 3
model: github-copilot/claude-haiku-5.5
coder_thinking: medium  # off | minimal | low | medium | high
reviewer_model: github-copilot/claude-haiku-4.5
reviewer_thinking: high
allowed_models: []
primary_metric: accuracy
thresholds:
  accuracy: 1.01   # out of reach: only the budget may end this night
gates:
  schema_violations: 0
  latency_query_p95_ms: 50
budget_usd:
  experiment: 0.03
  night: 0.05
results_path: runs/e2e-budget/results.jsonl
