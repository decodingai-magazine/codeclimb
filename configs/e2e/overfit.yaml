# End-to-end test that the loop climbs. Real models only. The scenario is a generated copy of datenorm
# whose dev and test hold the train items (npm run build:scenario:overfit), so the coder can read every
# answer: the night must end on `thresholds`, and test must equal dev.
scenario: generated/datenorm-overfit
sandbox: docker
max_rounds: 4
deadline: 2h
timeouts:
  experiment_min: 10
  eval_min: 3
model: github-copilot/claude-haiku-5.5
coder_thinking: medium  # off | minimal | low | medium | high
reviewer_model: github-copilot/claude-haiku-4.5
reviewer_thinking: high
allowed_models: []
primary_metric: accuracy
thresholds:
  accuracy: 0.97   # 31 of 32: one stubborn item must not fail the test
gates:
  schema_violations: 0
  latency_query_p95_ms: 50
budget_usd:
  experiment: 0.15
  night: 0.5
results_path: e2e-overfit/results.jsonl
