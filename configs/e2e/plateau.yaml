# End-to-end test of the plateau cap. Run with --mock: mock capitals keeps nothing,
# so the night must end on `plateau` after round 1, not on `max_rounds`.
scenario: scenarios/capitals
sandbox: docker
max_rounds: 3
plateau_rounds: 1
deadline: 1h
timeouts:
  experiment_min: 5
  eval_min: 5
model: github-copilot/claude-haiku-5.5
coder_thinking: medium  # off | minimal | low | medium | high
reviewer_model: github-copilot/claude-haiku-4.5
reviewer_thinking: high
allowed_models: [github-copilot/claude-haiku-4.5]
primary_metric: accuracy
thresholds:
  accuracy: 1.0
gates:
  schema_violations: 0
budget_usd:
  experiment: 0.5
  night: 2.0
results_path: runs/e2e-plateau/results.jsonl
