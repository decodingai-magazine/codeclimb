# Full night: up to 24 rounds × 1 experiment on the datenorm scenario, Docker sandboxes,
# Inngest dev server. Coders: GitHub Copilot Haiku via Pi; reviewer: a different Haiku.
scenario: scenarios/datenorm
sandbox: docker
max_rounds: 24
plateau_rounds: 3     # stop after 3 rounds in a row with nothing kept (0 = never)
# max_tokens: 5000000 # cap on coder + reviewer tokens for the night (omit = no cap)
deadline: 8h
timeouts:
  experiment_min: 15
  eval_min: 3
models:
  - github-copilot/claude-haiku-5.5
parallel:              # every model through round step_after, then min
  decay: step           # step | linear | none (every model, every round)
  step_after: 3
  min: 1
reviewer_model: github-copilot/claude-haiku-4.5
allowed_models: []
primary_metric: accuracy
thresholds:
  accuracy: 0.99
gates:
  schema_violations: 0
  latency_query_p95_ms: 50
min_gain: 0.02
budget_usd:
  experiment: 1.0
  night: 40.0
results_path: runs/datenorm/results.jsonl
