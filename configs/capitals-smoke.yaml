# Metering smoke night: a tiny scenario whose program calls a model through the
# metering proxy, so cost metrics are real. Docker sandboxes, Inngest dev server.
# Build the image first: npm run build:image
scenario: scenarios/capitals
sandbox: docker
max_rounds: 1
deadline: 1h
timeouts:
  experiment_min: 5
  eval_min: 5
models:
  - github-copilot/claude-haiku-5.5
parallel:              # every model through round step_after, then min
  decay: step           # step | linear | none (every model, every round)
  step_after: 3
  min: 1
reviewer_model: github-copilot/claude-sonnet-5
# The models the built program may call (through the metering proxy).
allowed_models: [github-copilot/claude-haiku-4.5]
primary_metric: accuracy
thresholds:
  accuracy: 1.0
gates:
  schema_violations: 0
min_gain: 0.01
budget_usd:
  experiment: 0.5
  night: 2.0
  eval: 0.1
  dev: 0.05   # the coder's runs of the program while it develops
results_path: runs/capitals-smoke/results.jsonl
