scenario: scenarios/graphrag
sandbox: docker
max_rounds: 5
deadline: 6h
timeouts:
  experiment_min: 20
  eval_min: 10
model: anthropic/claude-opus-5-5
coder_thinking: medium  # off | minimal | low | medium | high
reviewer_model: anthropic/claude-opus-5-5
reviewer_thinking: high
allowed_models:
  - openrouter/deepseek/deepseek-v4.1-flash
  - openrouter/typesafe/jev-1.14
  - openrouter/qwen/qwen3-embedding-4b
  - openrouter/qwen/qwen3-reranker-8b
primary_metric: extraction.mentions.f1
thresholds:
  extraction.mentions.f1: 0.8
  extraction.relations.undirected.f1: 0.6
  graph.b_cubed.recall: 0.98
  retrieval.by_kind.single_hop.metrics.edge_recall_at_k.mean: 0.95
  retrieval.by_kind.single_hop.metrics.answer_mrr.mean: 0.9
budget_usd:
  experiment: 2.5
  night: 15
results_path: runs-langchain/graphrag-cloud/results.jsonl
