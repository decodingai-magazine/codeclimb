scenario: scenarios/graphrag-lite
sandbox: inngest
max_rounds: 6
deadline: 6h
timeouts:
  experiment_min: 25
  eval_min: 10  # 22 documents against graphrag's 56
model: anthropic/claude-opus-5-5
coder_thinking: medium  # off | minimal | low | medium | high
reviewer_model: anthropic/claude-opus-5-5
reviewer_thinking: high
allowed_models:
  - openrouter/deepseek/deepseek-v4.1-flash
  - openrouter/typesafe/jev-1.14
  - openrouter/qwen/qwen3-embedding-4b
  - openrouter/qwen/qwen3-reranker-8b
primary_metric: extraction.mentions.f1
thresholds:
  extraction.mentions.f1: 0.9
  extraction.relations.directed.f1: 0.4
  graph.b_cubed.precision: 0.98
  graph.b_cubed.recall: 0.98
  retrieval.by_kind.single_hop.metrics.edge_recall_at_k.mean: 0.7
  retrieval.by_kind.multi_hop.metrics.path_complete.mean: 0.3
budget_usd:
  experiment: 2.5
  night: 15
results_path: runs/graphrag-lite-cloud/results.jsonl
