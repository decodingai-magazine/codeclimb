# Full night on datenorm-hard: a vaguer spec and 6 more families, sized to climb over several rounds.
# Docker sandboxes, Inngest dev server. Coders: GitHub Copilot Haiku via Pi; reviewer: a different Haiku.
# Build the image first: npm run build:image
scenario: scenarios/datenorm-hard
sandbox: docker
max_rounds: 10
plateau_rounds: 3     # stop after 3 rounds in a row with nothing kept (0 = never)
# max_tokens: 5000000 # cap on coder + reviewer tokens for the night (omit = no cap)
deadline: 4h
timeouts:
  experiment_min: 15
  eval_min: 3
models:
  - github-copilot/claude-haiku-5.5
  - github-copilot/claude-haiku-5.5
  - github-copilot/claude-haiku-5.5
parallel:              # branches per round: all models in round 1, decaying linearly to min by max_rounds
  decay: linear         # linear | none (every model, every round)
  min: 1
  widen_after: 1        # after 1 round with nothing kept, run every model again (0 = never)
reviewer_model: github-copilot/claude-haiku-4.5
allowed_models: []
primary_metric: accuracy
thresholds:
  accuracy: 0.90
gates:
  schema_violations: 0
  latency_query_p95_ms: 50
min_gain: 0.01
budget_usd:
  experiment: 1.0
  night: 20.0
results_path: runs/datenorm-hard/results.jsonl
