# The verifier's own copy of the trial topology (environment/docker-compose.yaml): the same sidecar, the same block.
services:
  main:
    network_mode: "service:dind"
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      CODECLIMB_PROXY_HOST: 172.17.0.1
    volumes:
      - app:/app
    depends_on:
      dind: { condition: service_healthy }
  dind:
    extends: { file: ../../shared/dind.compose.yaml, service: dind }
    volumes:
      - app:/app
volumes:
  app: {}
