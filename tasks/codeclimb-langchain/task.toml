schema_version = "1.4"
artifacts = [
  { source = "/app", exclude = [".env", "node_modules", "runs-inngest", "runs-langchain"] },
  # The harness's session files, for the leak scan in the separate verifier.
  { source = "/logs/agent/sessions/projects" },
]

[task]
name = "codeclimb/codeclimb-langchain"
version = "1.0.0"
description = "Build CodeClimb on LangChain from its build spec until the seven mock nights of E2E.md pass."

[verifier]
# A passing reference build takes about 7 min here (measured in Harbor, 2026-11-13); a hung build runs into the
# verifier's own limits, about 9100 s in all, and still writes reward.json before this one.
timeout_sec = 10800.0
environment_mode = "separate"

[agent]
# A placeholder until phase B measures it.
timeout_sec = 28800.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
# Set from the peaks of a reference build's verifier run in Harbor (2026-11-13): `main` reached 6.1 CPUs and 2.45 GB
# on Inngest, 2.2 CPUs and 0.73 GB on LangChain. The same limits on both stacks; memory leaves room for Claude Code.
# Docker limits `main` only (the sandboxes run in the dind sidecar) and does not enforce storage_mb: `main` plus the
# sidecar held 3.6 GB on Inngest, 5.1 GB on LangChain.
cpus = 6
memory_mb = 6144
storage_mb = 10240
