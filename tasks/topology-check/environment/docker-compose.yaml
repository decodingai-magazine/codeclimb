# The trial topology of docs/adr/0001: one Docker daemon per trial, a sidecar whose network namespace `main` shares.
services:
  main:
    # Shares the sidecar's network namespace: 127.0.0.1 and the Docker bridge are the same on both sides.
    network_mode: "service:dind"
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
    volumes:
      # The same path in both containers, so a bind mount of /app handed to the sidecar daemon names the same files.
      - app:/app
    depends_on:
      dind: { condition: service_healthy }
  dind:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - app:/app
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      retries: 30
    # The GitHub block. `main` shares this service's /etc/hosts; on `main` itself Docker rejects extra_hosts beside
    # the shared network mode. No wildcards: every host name needs its own entry,
    # so this lists the hosts the spec blocks by name, not every subdomain.
    extra_hosts:
      - "github.com:0.0.0.0"
      - "www.github.com:0.0.0.0"
      - "api.github.com:0.0.0.0"
      - "codeload.github.com:0.0.0.0"
      - "gist.github.com:0.0.0.0"
      - "objects.githubusercontent.com:0.0.0.0"
      - "raw.githubusercontent.com:0.0.0.0"
      - "release-assets.githubusercontent.com:0.0.0.0"
      - "github.io:0.0.0.0"
      - "deepwiki.com:0.0.0.0"
      - "gitmcp.io:0.0.0.0"
      - "sourcegraph.com:0.0.0.0"
      - "gitee.com:0.0.0.0"
volumes:
  app: {}
